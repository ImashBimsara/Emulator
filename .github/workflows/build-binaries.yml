name: Build Box64 and PRoot for Android

on:
  workflow_dispatch: # ඔබට අවශ්‍ය විටක GitHub Dashboard එකෙන් "Run workflow" ක්ලික් කර ක්‍රියාත්මක කළ හැක.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Setup Android NDK
        run: |
          echo "Downloading Android NDK r25c..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          echo "Extracting NDK..."
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git

      - name: Build Box64 for ARM64
        run: |
          git clone https://github.com/ptitSeb/box64.git
          cd box64
          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$ANDROID_NDK_HOME \
            -DARM64=1 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          # නම libbox64.so ලෙස වෙනස් කර root ෆෝල්ඩරයට එකතු කරමු
          cp box64 ../../libbox64.so

      - name: Build PRoot for Android (Termux NDK Source)
        run: |
          git clone https://github.com/termux/proot.git
          cd proot/src
          # Android NDK Clang compiler එක සහ sysroot හරහා නිවැරදිව compile කිරීම
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export LDFLAGS="-pie -fPIE"
          make -j$(nproc)
          cp proot ../../../libproot.so

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: |
            libbox64.so
            libproot.so
