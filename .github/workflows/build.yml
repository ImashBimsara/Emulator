name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex libtool autoconf automake \
            pkg-config zip unzip wget git make \
            binutils-aarch64-linux-gnu

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> "$GITHUB_ENV"

      - name: Build Talloc
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET=aarch64-linux-android
          API=24

          export CC="$NDK/${TARGET}${API}-clang"
          export AR="$NDK/llvm-ar"
          export RANLIB="$NDK/llvm-ranlib"
          export STRIP="$NDK/llvm-strip"
          export CFLAGS="-fPIC -D__ANDROID_API__=$API"

          wget -q https://www.samba.org/ftp/talloc/talloc-2.4.1.tar.gz
          tar -xf talloc-2.4.1.tar.gz
          cd talloc-2.4.1

          ./configure \
            --prefix="$GITHUB_WORKSPACE/talloc-install" \
            --host="$TARGET" \
            --disable-python \
            --disable-rpath \
            --cross-compile \
            --cross-execute='/bin/true' \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" CFLAGS="$CFLAGS"

          make -j"$(nproc)"
          make install

          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/talloc-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TALLOC_INSTALL=$GITHUB_WORKSPACE/talloc-install" >> "$GITHUB_ENV"

      - name: Build PRoot
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$NDK/aarch64-linux-android24-clang"
          export CXX="$NDK/aarch64-linux-android24-clang++"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/talloc-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/talloc-install/lib -ltalloc -llog"

          # ✅ GNU binutils - elf64-little නිවැරදිව හඳුනනවා
          export STRIP="/usr/bin/aarch64-linux-gnu-strip"
          export OBJCOPY="/usr/bin/aarch64-linux-gnu-objcopy"
          export OBJDUMP="/usr/bin/aarch64-linux-gnu-objdump"

          git clone https://github.com/termux/proot.git
          cd proot

          # ✅ ඇත්තම memfd patch එක
          cat > src/memfd_exec.h <<'EOF'
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/syscall.h>
          #include <string.h>
          #include <stdio.h>

          static inline const char* patch_box64_exec(const char *pathname) {
              if (!pathname || !strstr(pathname, "libbox64.so")) return pathname;
              int src_fd = open(pathname, O_RDONLY);
              if (src_fd < 0) return pathname;
              int mem_fd = syscall(__NR_memfd_create, "box64_memfd", 0x0001);
              if (mem_fd < 0) { close(src_fd); return pathname; }
              char buf[8192]; ssize_t n;
              while ((n = read(src_fd, buf, sizeof(buf))) > 0) write(mem_fd, buf, n);
              close(src_fd);
              static __thread char ppath[64];
              snprintf(ppath, sizeof(ppath), "/proc/self/fd/%d", mem_fd);
              return ppath;
          }
          EOF

          sed -i '1i #include "../memfd_exec.h"' src/syscall/enter.c
          sed -i '1i #include "../memfd_exec.h"' src/tracee/event.c
          sed -i 's/\bexecve(/execve(patch_box64_exec(/g' src/syscall/enter.c
          sed -i 's/\bexecveat(/execveat(patch_box64_exec(/g' src/syscall/enter.c
          sed -i 's/\bexecve(/execve(patch_box64_exec(/g' src/tracee/event.c

          cd src
          make -j"$(nproc)" \
            CC="$CC" \
            STRIP="$STRIP" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP"

          test -f proot

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp proot "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
            echo "Keystore decoded successfully."
          else
            echo "No release keystore configured."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
