name: Build Android APK with Official Ubuntu Rootfs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract Pre-compiled Binaries (ZIP Hack)
        run: |
          # ඔයා Upload කරපු libs.zip එකෙන් Box64 සහ PRoot එළියට ගැනීම
          cd app/src/main/jniLibs/arm64-v8a/
          if [ -f libs.zip ]; then
            unzip -o libs.zip
            rm libs.zip
          fi

      - name: Build Official Ubuntu 26.04 ARM64 Rootfs with Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd qemu-user-static

          mkdir -p app/src/main/assets
          cd app/src/main/assets
          rm -f rootfs.tzst
          
          echo "Finding the latest Ubuntu 26.04 ARM64 Base image..."
          BASE_URL="http://cdimage.ubuntu.com/ubuntu-base/releases/26.04/release"
          FILE_NAME=$(curl -sL "$BASE_URL/" | grep -oE 'ubuntu-base-26\.04(\.[0-9]+)?-base-arm64\.tar\.gz' | head -n 1)
          
          if [ -z "$FILE_NAME" ]; then
            echo "Error: Could not find the base image."
            exit 1
          fi
          
          echo "Downloading $FILE_NAME..."
          wget -q "$BASE_URL/$FILE_NAME" -O ubuntu.tar.gz
          
          echo "Extracting Ubuntu Base..."
          mkdir temp_rootfs && cd temp_rootfs
          tar -xf ../ubuntu.tar.gz
          
          echo "Downloading and Installing Wine (x86_64) for Box64..."
          wget -q "https://github.com/Kron4ek/Wine-Builds/releases/download/9.0/wine-9.0-amd64.tar.xz" -O ../wine.tar.xz
          mkdir -p opt
          tar -xf ../wine.tar.xz -C opt/
          mv opt/wine-9.0-amd64 opt/wine
          
          # [අලුත් කොටස] Rootfs එක ඇතුළටම ගොස් X11 සහ Wine Dependencies නිල වශයෙන් ස්ථාපනය කිරීම
          echo "Installing essential C++ and X11 graphics libraries via apt inside Rootfs..."
          
          # QEMU සහ අත්‍යවශ්‍ය ලිපිගොනු Rootfs වෙත යැවීම
          sudo cp /usr/bin/qemu-aarch64-static usr/bin/
          sudo cp /etc/resolv.conf etc/resolv.conf
          
          # chroot හරහා apt කමාන්ඩ්ස් ක්‍රියාත්මක කර අත්‍යවශ්‍ය පැකේජ් ස්ථාපනය කිරීම
          sudo chroot . /bin/sh -c "
            apt-get update && 
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              gcc-13-base libgcc-s1 libstdc++6 \
              libx11-6 libxext6 libfreetype6 libfontconfig1 \
              libgl1 libegl1 libvulkan1 \
              libasound2 libc6 libdl2 libpthread-stubs0-dev && 
            apt-get clean
          "
          
          # QEMU සහ තාවකාලික ලිපිගොනු ඉවත් කිරීම
          sudo rm -f usr/bin/qemu-aarch64-static etc/resolv.conf
          
          echo "Fixing Wine 32-bit Crash by symlinking 64-bit Wine..."
          rm -f opt/wine/bin/wine
          ln -s wine64 opt/wine/bin/wine
          
          echo "Fixing Absolute Symlinks for Android Extraction..."
          find . -type l -lname '/*' | while read -r link; do
              target=$(readlink "$link")
              rel_target=$(realpath -m --relative-to="$(dirname "$link")" ".$target")
              rm -f "$link"
              ln -s "$rel_target" "$link"
          done
          
          mkdir -p tmp
          chmod 1777 tmp
          
          echo "Compressing back to rootfs.tzst..."
          tar --hard-dereference -I 'zstd -19' -cf ../rootfs.tzst .
          
          cd ..
          rm -rf temp_rootfs ubuntu.tar.gz wine.tar.xz
          
          echo "✅ New Ubuntu 26.04 Rootfs with Wine created successfully!"
          
      - name: Clean Up Uncompressed Large Files
        run: |
          echo "Cleaning up temporary uncompressed files to keep APK size small..."
          rm -rf app/src/main/assets/temp_rootfs
          rm -rf app/src/main/assets/ubuntu.tar.gz
          rm -rf app/src/main/assets/wine.tar.xz
          
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
