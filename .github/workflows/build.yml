
name: Build Android APK with Split Rootfs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Extract Pre-compiled Binaries (ZIP Hack)
        run: |
          cd app/src/main/jniLibs/arm64-v8a/
          if [ -f libs.zip ]; then
            unzip -o libs.zip
            rm libs.zip
            chmod +x *.so 2>/dev/null || true
          fi

      - name: Combine Rootfs and Replace Old Wine
        run: |
          echo "Merging rootfs and wine parts from assets..."
          ROOTFS_PARTS="app/src/main/assets/rootfs_parts"
          WINE_PARTS="app/src/main/assets/wine_parts"
          OUT_FILE="app/src/main/assets/rootfs.tzst"
    
          if ls "$ROOTFS_PARTS"/rootfs.tzst.part* 1> /dev/null 2>&1; then
            cat "$ROOTFS_PARTS"/rootfs.tzst.part* > temp_rootfs.tzst
          else
            echo "❌ ERROR: No rootfs parts found!"
            exit 1
          fi
    
          if ls "$WINE_PARTS"/wine_part_* 1> /dev/null 2>&1; then
            cat "$WINE_PARTS"/wine_part_* > temp_wine.tar.gz
          else
            echo "❌ ERROR: No wine parts found!"
            exit 1
          fi
    
          echo "Extracting rootfs into workspace..."
          mkdir -p rootfs_workspace
          tar -I zstd -xf temp_rootfs.tzst -C rootfs_workspace/
    
          echo "Deep cleaning ANY old Wine traces (To reduce size)..."
          rm -rf rootfs_workspace/opt/wine
          rm -rf rootfs_workspace/usr/local/wine
          rm -rf rootfs_workspace/usr/lib/wine
          rm -rf rootfs_workspace/usr/lib/i386-linux-gnu/wine
          rm -rf rootfs_workspace/usr/lib/x86_64-linux-gnu/wine
          rm -rf rootfs_workspace/usr/lib/aarch64-linux-gnu/wine
          rm -f rootfs_workspace/usr/bin/wine*
          rm -f rootfs_workspace/usr/local/bin/wine*
    
          echo "Injecting NEW Custom Wine..."
          tar -xzf temp_wine.tar.gz -C rootfs_workspace/
    
          echo "Creating wine64 copy for Box64 compatibility..."
          cp rootfs_workspace/opt/wine/bin/wine rootfs_workspace/opt/wine/bin/wine64
    
          echo "Re-compressing into final rootfs.tzst with HIGH Compression..."
          cd rootfs_workspace
          tar -I 'zstd -19 -T0' -cf ../"$OUT_FILE" .
          cd ..
    
          echo "Cleaning up temporary files..."
          rm -rf "$ROOTFS_PARTS" "$WINE_PARTS" temp_rootfs.tzst temp_wine.tar.gz rootfs_workspace/
    
          echo "✅ Rootfs successfully updated and highly compressed!"
          ls -lh "$OUT_FILE"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
