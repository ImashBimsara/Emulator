name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    # ==========================================
    # ✅ PRoot Patch & Compile Step (Fixed)
    # ==========================================
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bison flex libtool autoconf automake pkg-config zip unzip wget

    - name: Download and Setup Android NDK
      run: |
        echo "Downloading Android NDK r25c..."
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV

    - name: Get libtalloc from Termux
      run: |
        wget -q https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.4.1_aarch64.deb
        ar x libtalloc_2.4.1_aarch64.deb
        tar -xf data.tar.xz
        mkdir -p talloc_out/lib talloc_out/include
        cp data/data/com.termux/files/usr/lib/libtalloc.so* talloc_out/lib/
        cp data/data/com.termux/files/usr/include/talloc.h talloc_out/include/

    - name: Clone, Patch, and Compile PRoot
      run: |
        export NDK=$ANDROID_NDK_HOME
        export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
        export TARGET=aarch64-linux-android
        export API=24
        export CC=$TOOLCHAIN/bin/$TARGET$API-clang
        export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
        export AR=$TOOLCHAIN/bin/llvm-ar
        export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
        export CPPFLAGS="-I$PWD/talloc_out/include"
        export LDFLAGS="-L$PWD/talloc_out/lib -llog"

        git clone https://github.com/termux/proot.git
        cd proot

        # 1. memfd patch එක හදනවා
        cat << 'EOF' > src/syscall/memfd_exec.h
        #define _GNU_SOURCE
        #include <unistd.h>
        #include <fcntl.h>
        #include <sys/syscall.h>
        #include <string.h>
        #include <stdio.h>

        static inline const char* patch_box64_exec(const char *pathname) {
            if (!pathname || !strstr(pathname, "libbox64.so")) return pathname;
            int src_fd = open(pathname, O_RDONLY);
            if (src_fd < 0) return pathname;
            int mem_fd = syscall(__NR_memfd_create, "box64_memfd", 0x0001);
            if (mem_fd < 0) { close(src_fd); return pathname; }
            char buf[8192]; ssize_t n;
            while ((n = read(src_fd, buf, sizeof(buf))) > 0) write(mem_fd, buf, n);
            close(src_fd);
            static thread_local char ppath[64];
            snprintf(ppath, sizeof(ppath), "/proc/self/fd/%d", mem_fd);
            return ppath;
        }
        EOF

        # 2. PRoot එකේ execve කෝල් කරන තැන් patch කරනවා
        sed -i 's/#include "syscall\/syscall.h"/#include "syscall\/syscall.h"\n#include "memfd_exec.h"/' src/syscall/enter.c
        sed -i 's/execve(/execve(patch_box64_exec(/g' src/syscall/enter.c
        sed -i 's/execveat(/execveat(patch_box64_exec(/g' src/syscall/enter.c
        
        sed -i 's/#include "tracee\/tracee.h"/#include "tracee\/tracee.h"\n#include "syscall\/memfd_exec.h"/' src/tracee/event.c
        sed -i 's/execve(/execve(patch_box64_exec(/g' src/tracee/event.c

        # 3. Configure සහ Compile කරනවා
        ./configure --host=$TARGET --prefix=$PWD/../proot_out --disable-dependency-tracking
        make -j$(nproc)
        
        # 4. හදපු proot එක jniLibs එකට libproot.so විදිහට දානවා
        mkdir -p ../app/src/main/jniLibs/arm64-v8a/
        cp src/proot ../app/src/main/jniLibs/arm64-v8a/libproot.so
    # ==========================================

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/my-release-key.jks

    - name: Build Signed Release APK
      run: |
        gradle assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app/build/outputs/apk/release/app-release.apk
