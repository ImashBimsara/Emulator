name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex libtool autoconf automake \
            pkg-config zip unzip wget git make \
            binutils-aarch64-linux-gnu file

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> "$GITHUB_ENV"

      - name: Build Talloc
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET=aarch64-linux-android
          API=24

          export CC="$NDK/${TARGET}${API}-clang"
          export AR="$NDK/llvm-ar"
          export RANLIB="$NDK/llvm-ranlib"
          export STRIP="$NDK/llvm-strip"
          export CFLAGS="-fPIC -D__ANDROID_API__=$API"

          wget -q https://www.samba.org/ftp/talloc/talloc-2.4.1.tar.gz
          tar -xf talloc-2.4.1.tar.gz
          cd talloc-2.4.1

          ./configure \
            --prefix="$GITHUB_WORKSPACE/talloc-install" \
            --host="$TARGET" \
            --disable-python \
            --disable-rpath \
            --cross-compile \
            --cross-execute='/bin/true' \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" CFLAGS="$CFLAGS"

          make -j"$(nproc)"
          make install

          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/talloc-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TALLOC_INSTALL=$GITHUB_WORKSPACE/talloc-install" >> "$GITHUB_ENV"

      - name: Build PRoot
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$NDK/aarch64-linux-android24-clang"
          export CXX="$NDK/aarch64-linux-android24-clang++"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/talloc-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/talloc-install/lib -ltalloc -llog"

          export STRIP="/usr/bin/aarch64-linux-gnu-strip"
          export OBJCOPY="/usr/bin/aarch64-linux-gnu-objcopy"
          export OBJDUMP="/usr/bin/aarch64-linux-gnu-objdump"

          git clone https://github.com/termux/proot.git
          cd proot/src

          make -j"$(nproc)" \
            CC="$CC" \
            STRIP="$STRIP" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP"

          test -f proot

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp proot "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"

      - name: Diagnose Box64 and PRoot ELF
        shell: bash
        run: |
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          echo "=== Searching for native binaries ==="
          find "$GITHUB_WORKSPACE" -name "*.so*" -type f

          BOX64="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libbox64.so"
          PROOT="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"

          if [ -f "$BOX64" ]; then
            echo "=== BOX64 FILE INFO ==="
            file "$BOX64"
            sha256sum "$BOX64"
            echo "=== BOX64 ELF HEADER & PROGRAM HEADERS ==="
            "$READELF" -h -l "$BOX64"
            echo "=== BOX64 DYNAMIC SECTION ==="
            "$READELF" -d "$BOX64" || true
          else
            echo "WARNING: libbox64.so not found at $BOX64"
          fi

          if [ -f "$PROOT" ]; then
            echo "=== PROOT ELF HEADER & PROGRAM HEADERS ==="
            "$READELF" -h -l "$PROOT"
            echo "=== PROOT DYNAMIC SECTION ==="
            "$READELF" -d "$PROOT" || true
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
            echo "Keystore decoded successfully."
          else
            echo "No release keystore configured."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
