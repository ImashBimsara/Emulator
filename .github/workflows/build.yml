name: Build Android APK with Split Rootfs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Extract Pre-compiled Binaries (ZIP Hack)
        run: |
          cd app/src/main/jniLibs/arm64-v8a/
          if [ -f libs.zip ]; then
            unzip -o libs.zip
            rm libs.zip
            chmod +x *.so
          fi

      - name: Compile Static Talloc & Termux PRoot for Android ARM64
        run: |
          mkdir -p /tmp/proot_build && cd /tmp/proot_build

          # 1. Download Android NDK r25c
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          NDK_HOME="/tmp/proot_build/android-ndk-r25c"

          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export AR="$TOOLCHAIN/llvm-ar"
          export STRIP="$TOOLCHAIN/llvm-strip"
          export OBJCOPY="$TOOLCHAIN/llvm-objcopy"
          export OBJDUMP="$TOOLCHAIN/llvm-objdump"

          # 2. Compile Talloc statically with Android NDK (avoids glibc libc.so.6 crash)
          wget -q https://www.samba.org/ftp/talloc/talloc-2.4.2.tar.gz
          tar -xzf talloc-2.4.2.tar.gz
          cd talloc-2.4.2
          cat << 'EOF' > config.h
          #define HAVE_VA_COPY 1
          #define HAVE_STRNLEN 1
          #define HAVE_STRDUP 1
          #define HAVE_STRNDUP 1
          #define HAVE_STRLCPY 1
          #define HAVE_STRLCAT 1
          #define HAVE_MEMMEM 1
          #define HAVE_SYS_AUXV_H 1
          #define HAVE_GETAUXVAL 1
          #define _GNU_SOURCE 1
          #define memset_s(d, ds, c, n) memset((d), (c), (n))
          EOF
          $CC -O3 -fPIE -I. -Ilib/replace -DHAVE_CONFIG_H -c talloc.c -o talloc.o
          $AR rcs libtalloc.a talloc.o
          TALLOC_DIR=$(pwd)
          cd ..

          # 3. Clone and Cross-Compile Termux PRoot + Loader
          git clone --depth 1 https://github.com/termux/proot.git termux-proot
          cd termux-proot

          make -C src proot loader \
            CC="$CC" \
            LD="$CC" \
            STRIP="$STRIP" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            HAS_LOADER_32BIT="" \
            CFLAGS="-O3 -fPIE -I. -I$TALLOC_DIR -DARG_MAX=131072 -D__ANDROID__" \
            LDFLAGS="-pie $TALLOC_DIR/libtalloc.a"

          # 4. Copy libproot.so and libproot-loader.so into jniLibs
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp src/proot "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"
          cp src/loader/loader "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot-loader.so"
          chmod +x "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"
          chmod +x "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot-loader.so"
          rm -rf /tmp/proot_build

      - name: Combine Rootfs and Replace Old Wine
        run: |
          echo "Merging rootfs and wine parts from assets..."
          ROOTFS_PARTS="app/src/main/assets/rootfs_parts"
          WINE_PARTS="app/src/main/assets/wine_parts"
          OUT_FILE="app/src/main/assets/rootfs.tzst"
    
          if ls "$ROOTFS_PARTS"/rootfs.tzst.part* 1> /dev/null 2>&1; then
            cat "$ROOTFS_PARTS"/rootfs.tzst.part* > temp_rootfs.tzst
          else
            echo "❌ ERROR: No rootfs parts found!"
            exit 1
          fi
    
          if ls "$WINE_PARTS"/wine_part_* 1> /dev/null 2>&1; then
            cat "$WINE_PARTS"/wine_part_* > temp_wine.tar.gz
          else
            echo "❌ ERROR: No wine parts found!"
            exit 1
          fi
    
          echo "Extracting rootfs into workspace..."
          mkdir -p rootfs_workspace
          tar -I zstd -xf temp_rootfs.tzst -C rootfs_workspace/
    
          echo "Deep cleaning ANY old Wine traces (To reduce size)..."
          rm -rf rootfs_workspace/opt/wine
          rm -rf rootfs_workspace/usr/local/wine
          rm -rf rootfs_workspace/usr/lib/wine
          rm -rf rootfs_workspace/usr/lib/i386-linux-gnu/wine
          rm -rf rootfs_workspace/usr/lib/x86_64-linux-gnu/wine
          rm -rf rootfs_workspace/usr/lib/aarch64-linux-gnu/wine
          rm -f rootfs_workspace/usr/bin/wine*
          rm -f rootfs_workspace/usr/local/bin/wine*
    
          echo "Injecting NEW Custom Wine..."
          tar -xzf temp_wine.tar.gz -C rootfs_workspace/
    
          echo "Creating wine64 copy for Box64 compatibility..."
          cp rootfs_workspace/opt/wine/bin/wine rootfs_workspace/opt/wine/bin/wine64
    
          echo "Re-compressing into final rootfs.tzst with HIGH Compression..."
          cd rootfs_workspace
          tar -I 'zstd -19 -T0' -cf ../"$OUT_FILE" .
          cd ..
    
          echo "Cleaning up temporary files..."
          rm -rf "$ROOTFS_PARTS" "$WINE_PARTS" temp_rootfs.tzst temp_wine.tar.gz rootfs_workspace/
    
          echo "✅ Rootfs successfully updated and highly compressed!"
          ls -lh "$OUT_FILE"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
