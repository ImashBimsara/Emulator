name: Build Compatible Box64

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-box64:
    runs-on: ubuntu-latest
    container: ubuntu:20.04  # අලුත් සර්වර් එක ඇතුලේ පරණ 20.04 පරිසරයක් නිර්මාණය කිරීම

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          # Container එක ඇතුළේ ප්‍රශ්නයක් නැතිවෙන්න අත්‍යවශ්‍ය දේවල් මුලින්ම දාමු
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake make git tar

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Box64 (Linux Native via Cross-Compile)
        run: |
          git clone https://github.com/ptitSeb/box64.git
          cd box64
          mkdir build && cd build
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DARM_DYNAREC=ON \
            -DCMAKE_BUILD_TYPE=Release
            
          make -j"$(nproc)"
          
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp box64 "$GITHUB_WORKSPACE/output/libbox64.so"

      - name: Upload libbox64.so
        uses: actions/upload-artifact@v4
        with:
          name: compatible-libbox64
          path: output/libbox64.so
          retention-days: 1
