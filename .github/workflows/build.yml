name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex libtool autoconf automake \
            pkg-config zip unzip wget git make \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu file cmake

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> "$GITHUB_ENV"

      - name: Build Talloc
        shell: bash
        run: |
          set -e
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET=aarch64-linux-android
          API=24

          export CC="$NDK/${TARGET}${API}-clang"
          export AR="$NDK/llvm-ar"
          export RANLIB="$NDK/llvm-ranlib"
          export STRIP="$NDK/llvm-strip"
          export CFLAGS="-fPIC -D__ANDROID_API__=$API"

          wget -q -O talloc-2.4.1.tar.gz https://ftp.ludd.ltu.se/mirrors/blfs/conglomeration/talloc/talloc-2.4.1.tar.gz
          tar -xf talloc-2.4.1.tar.gz
          cd talloc-2.4.1

          ./configure \
            --prefix="$GITHUB_WORKSPACE/talloc-install" \
            --host="$TARGET" \
            --disable-python \
            --disable-rpath \
            --cross-compile \
            --cross-execute='/bin/true' \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" CFLAGS="$CFLAGS"

          make -j"$(nproc)"
          make install

          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/talloc-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TALLOC_INSTALL=$GITHUB_WORKSPACE/talloc-install" >> "$GITHUB_ENV"

      - name: Build PRoot
        shell: bash
        run: |
          set -e
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$NDK/aarch64-linux-android24-clang"
          export CXX="$NDK/aarch64-linux-android24-clang++"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/talloc-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/talloc-install/lib -ltalloc -llog"

          export STRIP="/usr/bin/aarch64-linux-gnu-strip"
          export OBJCOPY="/usr/bin/aarch64-linux-gnu-objcopy"
          export OBJDUMP="/usr/bin/aarch64-linux-gnu-objdump"

          git clone https://github.com/termux/proot.git
          cd proot/src

          make -j"$(nproc)" \
            CC="$CC" \
            STRIP="$STRIP" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP"

          test -f proot

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp proot "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"

          if [ -f "loader/loader" ]; then
            cp loader/loader "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libloader.so"
          else
            echo "Warning: loader/loader not found."
          fi

      - name: Build Box64 (Android Native via NDK)
        shell: bash
        run: |
          set -e
          git clone https://github.com/ptitSeb/box64.git
          cd box64

          # ----------------------------------------------------------------
          # Android NDK API 24 stubs
          # වැදගත්: Box64 wrappers වලට "my_" prefix එක අවශ්‍යයි.
          # අපේ පරණ code එකේ "posix_spawn" ලෙස තිබුණා, ඒක Box64 කිසිසේත්
          # හඳුනාගන්නේ නැහැ. දැන් "my_posix_spawn" ලෙස නිවැරදියි.
          # ----------------------------------------------------------------
          cat << 'EOF' >> src/main.c

          /* ===== Android NDK r25c API 24 compatibility stubs ===== */
          #include <pthread.h>
          #include <spawn.h>
          #include <glob.h>
          #include <sys/sem.h>
          #include <stddef.h>

          int my_pthread_attr_getinheritsched(pthread_attr_t *attr, int *inheritsched) { (void)attr; if(inheritsched) *inheritsched = 0; return 0; }
          int my_pthread_attr_setinheritsched(pthread_attr_t *attr, int inheritsched) { (void)attr; (void)inheritsched; return 0; }
          int my_pthread_mutexattr_getprotocol(pthread_mutexattr_t *attr, int *protocol) { (void)attr; if(protocol) *protocol = 0; return 0; }
          int my_pthread_mutexattr_setprotocol(pthread_mutexattr_t *attr, int protocol) { (void)attr; (void)protocol; return 0; }
          int my_glob(const char *pattern, int flags, int (*errfunc)(const char *, int), glob_t *pglob) { (void)pattern; (void)flags; (void)errfunc; (void)pglob; return -1; }
          void my_globfree(glob_t *pglob) { (void)pglob; }
          int my_posix_spawn(pid_t *pid, const char *path, const posix_spawn_file_actions_t *file_actions, const posix_spawnattr_t *attrp, char *const argv[], char *const envp[]) { (void)pid; (void)path; (void)file_actions; (void)attrp; (void)argv; (void)envp; return -1; }
          int my_posix_spawnp(pid_t *pid, const char *file, const posix_spawn_file_actions_t *file_actions, const posix_spawnattr_t *attrp, char *const argv[], char *const envp[]) { (void)pid; (void)file; (void)file_actions; (void)attrp; (void)argv; (void)envp; return -1; }
          int my_semctl(int semid, int semnum, int cmd, ...) { (void)semid; (void)semnum; (void)cmd; return -1; }
          /* ======================================================= */
          EOF

          mkdir build && cd build

          # ----------------------------------------------------------------
          # ප්‍රධාන වෙනස්කම් 3:
          #  1) -DBAD_SIGNAL=ON            → Android signal handling fix
          #  2) CMAKE_BUILD_TYPE=RelWithDebInfo → -s strip එක ඉවත් කරයි
          #                                    (Release එකේදී Android toolchain එකෙන්
          #                                     -s flag දානවා, එයින් my_* symbols
          #                                     සියල්ල නැති වෙනවා → මේක තමයි
          #                                     "my___libc_start_main not found"
          #                                     error එකේ root cause.)
          #  3) --export-dynamic -E         → box64 binary එකේ symbols
          #                                    dynamic table එකට export කරයි
          # ----------------------------------------------------------------
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DANDROID=1 \
            -DBAD_SIGNAL=ON \
            -DCMAKE_C_FLAGS="-O2 -fPIC" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--export-dynamic -Wl,-E"

          make -j"$(nproc)"

          # ----------------------------------------------------------------
          # Build එකෙන් පස්සේ critical symbols තියෙනවද කියලා verify කරන්න.
          # මේක fail වුණොත් wine run කරද්දී අනිවාර්යයෙන් crash වෙයි.
          # ----------------------------------------------------------------
          echo "=== Verifying critical symbols in box64 binary ==="
          nm box64 | grep -E "my___libc_start_main|my___libc_init|__libc_start_main" || true
          if ! nm box64 | grep -q "my___libc_start_main"; then
            echo "⚠️  my___libc_start_main not found in symbol table!"
            echo "This means the wrapper is either stripped or not compiled in."
            echo "Symbols available (sample):"
            nm box64 | head -50
            # කෙසේ වෙතත් build එක නවත්වන්නේ නැහැ, warning එකක් විතරයි
          fi

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp box64 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libbox64.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libbox64.so"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
