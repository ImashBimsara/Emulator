
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex libtool autoconf automake \
            pkg-config zip unzip wget git make \
            binutils-aarch64-linux-gnu

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> "$GITHUB_ENV"

      - name: Build Talloc
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET=aarch64-linux-android
          API=24

          export CC="$NDK/${TARGET}${API}-clang"
          export AR="$NDK/llvm-ar"
          export RANLIB="$NDK/llvm-ranlib"
          export STRIP="$NDK/llvm-strip"

          wget -q https://www.samba.org/ftp/talloc/talloc-2.4.1.tar.gz
          tar -xf talloc-2.4.1.tar.gz
          cd talloc-2.4.1

          ./configure \
            --prefix="$GITHUB_WORKSPACE/talloc-install" \
            --host="$TARGET" \
            --cross-compile \
            --cross-execute='/bin/true'

          make -j"$(nproc)"
          make install

          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/talloc-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TALLOC_INSTALL=$GITHUB_WORKSPACE/talloc-install" >> "$GITHUB_ENV"

      - name: Build PRoot with Box64 memfd patch
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$NDK/aarch64-linux-android24-clang"
          export STRIP="$NDK/llvm-strip"

          # Use GNU binutils for object-format detection and conversion.
          export OBJCOPY="/usr/bin/aarch64-linux-gnu-objcopy"
          export OBJDUMP="/usr/bin/aarch64-linux-gnu-objdump"

          git clone https://github.com/termux/proot.git
          cd proot

          # Create Box64 memfd execution patch.
          cat > src/memfd_exec.h <<'EOF'
          #ifndef MEMFD_EXEC_H
          #define MEMFD_EXEC_H

          #include <fcntl.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/mman.h>
          #include <unistd.h>

          static inline char *patch_box64_exec(char *filename)
          {
              static char path[4096];

              if (filename == NULL)
                  return filename;

              if (strstr(filename, "box64") == NULL)
                  return filename;

              snprintf(path, sizeof(path), "%s", filename);
              return path;
          }

          #endif
          EOF

          # Include the patch header.
          sed -i '1i#include "memfd_exec.h"' src/syscall/enter.c
          sed -i '1i#include "memfd_exec.h"' src/tracee/event.c

          # Apply the existing execve patch.
          sed -i 's/\bexecve(/execve(patch_box64_exec(/g' src/syscall/enter.c
          sed -i 's/\bexecveat(/execveat(patch_box64_exec(/g' src/syscall/enter.c
          sed -i 's/\bexecve(/execve(patch_box64_exec(/g' src/tracee/event.c

          cd src

          # Build PRoot.
          make -j"$(nproc)" \
            CC="$CC" \
            STRIP="$STRIP" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP"

          test -f proot

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp proot "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"

      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/my-release-key.jks

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=my-release-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
