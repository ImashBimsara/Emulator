name: Build Android APK with Split Rootfs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Extract Pre-compiled Binaries (ZIP Hack)
        run: |
          cd app/src/main/jniLibs/arm64-v8a/
          if [ -f libs.zip ]; then
            unzip -o libs.zip
            rm libs.zip
          fi
      
      - name: Merge Rootfs Parts into Assets
        run: |
          echo "Merging rootfs parts from app/src/main/assets/rootfs_parts..."
          PARTS_DIR="app/src/main/assets/rootfs_parts"
          OUT_FILE="app/src/main/assets/rootfs.tzst"

          rm -f "$OUT_FILE"

          if ls "$PARTS_DIR"/rootfs.tzst.part* 1> /dev/null 2>&1; then
            cat "$PARTS_DIR"/rootfs.tzst.part* > "$OUT_FILE"
            echo "Rootfs merged successfully!"
            ls -lh "$OUT_FILE"

            # APK එකේ Size එක වැඩි වීම වැළැක්වීමට parts ෆෝල්ඩරය assets වලින් ඉවත් කිරීම
            rm -rf "$PARTS_DIR"
            echo "Removed temporary rootfs_parts from assets."
          else
            echo "❌ ERROR: No part files found in $PARTS_DIR!"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
