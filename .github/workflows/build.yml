name: Build Android APK with Split Rootfs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Extract Pre-compiled Binaries (ZIP Hack)
        run: |
          cd app/src/main/jniLibs/arm64-v8a/
          if [ -f libs.zip ]; then
            unzip -o libs.zip
            rm libs.zip
          fi

      - name: Rebuild Rootfs with WoW64 Wine on Cloud
        run: |
          echo "Installing zstd..."
          sudo apt-get update && sudo apt-get install -y zstd

          echo "1. Merging existing rootfs parts..."
          cat app/src/main/assets/rootfs_parts/rootfs.tzst.part* > /tmp/old_rootfs.tzst

          echo "2. Extracting old rootfs..."
          mkdir /tmp/rootfs_work
          cd /tmp/rootfs_work
          tar -I zstd -xf /tmp/old_rootfs.tzst

          echo "3. Removing old 64-bit Wine and downloading WoW64 Wine..."
          rm -rf opt/wine
          wget -q "https://github.com/Kron4ek/Wine-Builds/releases/download/9.0/wine-9.0-amd64-x86.tar.xz" -O wine.tar.xz
          
          echo "4. Extracting WoW64 Wine into rootfs..."
          mkdir -p opt
          tar -xf wine.tar.xz -C opt/
          mv opt/wine-9.0-amd64-x86 opt/wine
          rm wine.tar.xz
          
          # Wine 32-bit Crash එකට විසඳුමක් විදිහට Symlink එක හරිගැස්සීම
          rm -f opt/wine/bin/wine
          ln -s wine64 opt/wine/bin/wine

          echo "5. Re-compressing into new rootfs.tzst..."
          tar -I 'zstd -19' -cf $GITHUB_WORKSPACE/app/src/main/assets/rootfs.tzst .

          echo "6. Cleaning up old parts from assets to save APK size..."
          rm -rf $GITHUB_WORKSPACE/app/src/main/assets/rootfs_parts
          
          echo "✅ Rootfs successfully upgraded to WoW64!"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
