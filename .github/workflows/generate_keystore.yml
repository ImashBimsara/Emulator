name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          # මෙතන තමයි අපි ඔයාගේ පාස්වර්ඩ් එක දාන්නේ (ඔයාට කැමති එකක් දාන්න)
          PASS="Imash123" 
          
          # Keystore එක හදනවා
          keytool -genkeypair -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass $PASS -keypass $PASS -dname "CN=Android Developer, OU=Android, O=Android, L=Colombo, ST=Western, C=LK"
          
          # ඒක Base64 වලට හරවනවා
          base64 my-release-key.jks > keystore_base64.txt

      - name: Upload Keystore Base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64-file
          path: keystore_base64.txt
