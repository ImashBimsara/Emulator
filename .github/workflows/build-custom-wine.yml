name: Build Patched Wine 9.0 (Android)

on:
  workflow_dispatch: # ඔබට අවශ්‍ය වෙලාවට පමණක් Run කිරීමට

jobs:
  build-wine:
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space (Optional but safe)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Configure APT for ARM64 Ports & Install Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          
          # පවතින 3rd party repos amd64 වලට පමණක් සීමා කිරීම (404 errors වැළැක්වීමට)
          sudo find /etc/apt/sources.list.d/ -name "*.list" -exec sed -i 's/^deb /deb [arch=amd64] /g' {} +
          
          # Ubuntu 24.04 main sources amd64 වලට සීමා කිරීම
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          
          # ARM64 Packages සඳහා ports.ubuntu.com අලුතින් හඳුන්වා දීම
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources <<EOF
          Types: deb
          Architectures: arm64
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          
          # Update කිරීම (සුළු 3rd party warnings ආවොත් ignore කිරීමට || true යොදා ඇත)
          sudo apt-get update || true
          
          # අත්‍යවශ්‍ය Cross-compilers සහ X11/FreeType libraries install කිරීම
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            mingw-w64 flex bison make wget xz-utils pkg-config \
            libx11-dev:arm64 libfreetype-dev:arm64 \
            libxext-dev:arm64 libvulkan-dev:arm64

      - name: Download Wine 9.0 Source
        run: |
          wget https://dl.winehq.org/wine/source/9.0/wine-9.0.tar.xz
          tar -xf wine-9.0.tar.xz
          
      - name: Apply Custom Android Patches (39-bit VMA Limit)
        run: |
          cd wine-9.0
          echo "Applying 39-bit VMA memory limit patch for Android ARM64..."
          sed -i 's/address_space_limit = ((UINT64)1 << 47) - 1;/address_space_limit = ((UINT64)1 << 39) - 1;/g' dlls/ntdll/unix/virtual.c
          sed -i 's/user_space_limit    = (UINT64)1 << 47;/user_space_limit    = (UINT64)1 << 39;/g' dlls/ntdll/unix/virtual.c
          
      - name: Configure Wine WoW64 for ARM64
        run: |
          cd wine-9.0
          mkdir build-arm64 && cd build-arm64
          ../configure \
            --host=aarch64-linux-gnu \
            --enable-archs=aarch64,x86_64,i386 \
            --with-x \
            --with-freetype \
            --without-alsa \
            --without-oss
          
      - name: Compile Wine (Takes 30-45 minutes)
        run: |
          cd wine-9.0/build-arm64
          make -j$(nproc)
          
      - name: Install & Create Artifact
        run: |
          cd wine-9.0/build-arm64
          make install DESTDIR=$(pwd)/../wine-android
          cd ../wine-android
          tar -czvf patched-wine.tar.gz opt/
          
      - name: Upload Patched Wine
        uses: actions/upload-artifact@v4
        with:
          name: patched-wine-android
          path: wine-9.0/wine-android/patched-wine.tar.gz
