plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.your.customemulator'
    compileSdk 34

    defaultConfig {
        applicationId "com.your.customemulator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    aaptOptions {
        noCompress "tzst"
    }

    // 1. අලුතින් එකතු කරපු Signing Configs
    signingConfigs {
        release {
            // මේවා GitHub Actions එකෙන් command line හරහා එන නිසා දැනට හිස්ව තියන්න පුළුවන්.
            // ඒත් Android Studio එකෙන් build කරනකොට error එකක් එන නිසා මේ විදිහට ලියන්න.
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "my-release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // 2. Release build එකට අපි හදපු signing config එක දෙනවා
            signingConfig signingConfigs.release
        }
        debug {
            // Debug build එකටත් අවශ්‍ය නම් මෙතනින් වෙනස් කරන්න පුළුවන් (අවශ්‍ය නෑ)
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.apache.commons:commons-compress:1.26.0'
    implementation 'com.github.luben:zstd-jni:1.5.5-10'
    implementation 'com.github.junrar:junrar:7.5.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
